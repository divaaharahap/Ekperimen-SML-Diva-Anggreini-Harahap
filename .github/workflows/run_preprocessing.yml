# Nama workflow
name: Automated Preprocessing Workflow

# Trigger: Berjalan setiap 'push' ke branch 'main'
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-preprocessing:
    # Menjalankan di server Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Download kodemu
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Siapkan Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install library dari requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Jalankan script automate-mu
      - name: Run preprocessing script
        # PENTING: Pastikan nama file .py ini sama persis
        run: python "preprocessing/automate-Diva_Anggreini_Harahap.py"

      # 5. Commit & Push file .csv yang baru dibuat
      - name: Commit and push processed data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # PENTING: Pastikan path file .csv ini sama persis
          git add "titanic_preprocessing.csv"

          # Commit hanya jika ada perubahan
          git diff --staged --quiet || git commit -m "Auto: Update processed dataset"
          git push
